CUTOFF: 5.533
data:
  test: null
  train:
    path: data/train.xyz
    property_map:
      QM_energy: energy
      QM_forces: forces
  valid:
    path: data/valid.xyz
    property_map:
      QM_energy: energy
      QM_forces: forces
fitting:
  auto_fit_reference_energies: false
  callbacks: []
  early_stopping:
    patience: 100
  early_stopping_patience: null
  keep: best
  loader_kwargs:
    batch_size: 1
    num_workers: 0
    persistent_workers: false
    pin_memory: false
  lr_warmup_steps: null
  max_n_pre_fit: 5000
  optimizer:
    lr: 0.003
    name: AdamW
  pre_fit_model: true
  scheduler:
    factor: 0.8
    name: ReduceLROnPlateau
    patience: 25
  swa: null
  trainer_kwargs:
    accelerator: gpu
    devices: 1
    enable_model_summary: false
    log_every_n_steps: 10
    max_epochs: 300
general:
  log_level: INFO
  progress: logged
  root_dir: graph-pes-results
  run_id: NequIP-L40S-MAE-batch1-9012782
  seed: 42
  torch:
    dtype: float32
    float32_matmul_precision: high
loss:
  energy:
    +PerAtomEnergyLoss:
      metric: MAE
  forces:
    +ForceRMSE:
      weight: 1.0
model:
  nequip:
    +NequIP:
      cutoff: 5.533
      direct_force_predictions: false
      elements:
      - Si
      - O
      features:
        edge_irreps: 0e + 1o + 2e
        node_irreps: 128x0e + 128x1o + 128x2e + 128x0o + 128x1e + 128x2o
      layers: 6
      prune_last_layer: false
      radial_features: 64
  offset: +LearnableOffset()
wandb:
  entity: trin4011-university-of-oxford
  log_model: false
  name: NequIP-L40S-MAE-batch1-9012782
  project: transfer-learning

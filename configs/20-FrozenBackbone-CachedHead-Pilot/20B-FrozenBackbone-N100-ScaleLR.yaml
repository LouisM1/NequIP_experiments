# Cached frozen-backbone N100 pilot: ScaleLR.
# Fresh seed-42 head; same data, balanced loss and epoch-based training as experiment 18.
# Only the scales LR differs between the two pilots; head/offset LR remains 0.003.

general:
  seed: 42
  progress: logged

model:
  +nmr_helpers.shielding_transfer.from_energy_force_model:
    checkpoint: graph-pes-results/Kavanagh-Med-9059603/model.pt
    freeze_backbone: true
    model:
      +nmr_helpers.extract_ms_isotropy.ScalarTensorAdditionModel:
        offset:
          +LearnableTensorOffset:
            length: 1
        nequip:
          +nmr_helpers.frozen_head_training.CachedTensorNequIP:
            elements: ["Si", "O"]
            cutoff: 6.0
            layers: 4
            radial_features: 64
            features:
              node_irreps: "128x0e + 64x1o + 32x2e"
              edge_irreps: "1x0e + 1x1o + 1x2e"
            prune_last_layer: true
            props: tensor
            target_method: direct
            target_tensor_irreps:
              +nmr_helpers.extract_ms_isotropy.ScalarTarget: {}

data:
  train:
    path: data/nmr_iso/train.xyz
    property_map: {MS_Iso_QM: tensor}
    shuffle: true
    # Same seed-42 subset of 100 structures across all three methods.
    n: 100
    seed: 42
  valid:
    path: data/nmr_iso/valid.xyz
    property_map: {MS_Iso_QM: tensor}
  test: null

loss:
  isotropy:
    +nmr_helpers.shared_head_training.ElementBalancedMSE:
      # Keep experiment 15's fixed loss weights unchanged across all learning-curve runs.
      # These constants were originally estimated from the full training split.
      si_std: 8.789599019755547
      o_std: 19.197689920683118
      weight: 1.0

fitting:
  # Pre-fit elemental offsets and scales on the selected 100 structures only.
  pre_fit_model: true
  max_n_pre_fit: null
  callbacks:
    - +nmr_helpers.frozen_head_training.FrozenFeatureCache:
        directory: graph-pes-results/.frozen-feature-cache
    - +nmr_helpers.shared_head_training.ElementRMSELogger: {}
  trainer_kwargs:
    accelerator: auto
    devices: 1
    precision: 32-true
    accumulate_grad_batches: 4
    # Ceiling, not a target duration. Validation early stopping is retained.
    max_epochs: 3000
    num_sanity_val_steps: 0
    log_every_n_steps: 10
  loader_kwargs:
    batch_size: 1
    num_workers: 0
    persistent_workers: false
    pin_memory: false
  optimizer:
    +nmr_helpers.frozen_head_training.FrozenHeadOptimizer:
      name: AdamW
      lr: 0.003
      scale_lr: 0.03
      weight_decay: 0.01
  scheduler:
    name: ReduceLROnPlateau
    patience: 25
    factor: 0.8
  early_stopping:
    patience: 300
  keep: best

wandb:
  entity: trin4011-university-of-oxford
  project: transfer-learning
  name: 20B-FrozenBackbone-N100-ScaleLR
  log_model: false

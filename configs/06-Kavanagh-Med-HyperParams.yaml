general:
  seed: 42
  progress: logged

model:
  offset: +LearnableOffset()
  nequip:
    +NequIP:
      elements: ["Si", "O"]
      cutoff: 6.0
      layers: 4
      radial_features: 64 # Why did Chiheb use this no. in his tutorial - could be optimised
      features:
        node_irreps : "128x0e + 64x1o + 32x2e"
        edge_irreps : "1x0e + 1x1o + 1x2e"
      direct_force_predictions: false
      prune_last_layer: true

data:
  train:
    path: data/train.xyz
    property_map: {QM_energy: energy, QM_forces: forces}
    shuffle: true
  valid:
    path: data/valid.xyz
    property_map: {QM_energy: energy, QM_forces: forces}
  test: null

loss:
  energy: 
    +PerAtomEnergyLoss:
      metric : MSE
      weight : 1000.0
  forces:
    +PropertyLoss:
      property : forces
      metric : MSE
      weight : 100.0

fitting:
  trainer_kwargs:
    accelerator: auto
    devices: 1
    max_epochs: 300
    log_every_n_steps: 10
  loader_kwargs:
    batch_size: 4
    num_workers: 4
    persistent_workers: true
    pin_memory : true
  optimizer:
    name: AdamW
    lr: 0.003
  scheduler:
    name: ReduceLROnPlateau
    patience: 25
    factor: 0.8
  early_stopping:
    patience: 100
  keep: best

wandb:
  entity: trin4011-university-of-oxford
  project: transfer-learning
  name: nequip-startingpoint
  log_model: false
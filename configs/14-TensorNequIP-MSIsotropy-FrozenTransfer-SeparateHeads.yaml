# Experiment 14: independent O/Si linear heads, frozen experiment-06 backbone.
# Transfer ONLY the E/F backbone; randomly initialise both NMR readout heads.
# No NMR-trained weights or optimizer/scheduler state are transferred.
# 256 independent readout weights + 2 elemental offsets = 258 active parameters.
# Scales are fixed training-set standard deviations, NOT learned parameters.
# Offsets are initialised from the training-label means in normal pre-fitting.
# Copy nmr_helpers/element_heads.py to ARC with this config and existing helpers.
# The only required input checkpoint is experiment-06 model.pt below.
# Use train.sbatch so run naming and resumable optimizer ordering are preserved.

general:
  seed: 42
  progress: logged

model:
  +nmr_helpers.element_heads.fresh_element_heads:
    si_std: 8.789599019755547
    o_std: 19.197689920683118
    model:
      +nmr_helpers.shielding_transfer.from_energy_force_model:
        checkpoint: graph-pes-results/Kavanagh-Med-9059603/model.pt
        freeze_backbone: true
        model:
          +nmr_helpers.extract_ms_isotropy.ScalarTensorAdditionModel:
            offset:
              +LearnableTensorOffset:
                length: 1
            nequip:
              +TensorNequIP:
                elements: ["Si", "O"]
                cutoff: 6.0
                layers: 4
                radial_features: 64
                features:
                  node_irreps: "128x0e + 64x1o + 32x2e"
                  edge_irreps: "1x0e + 1x1o + 1x2e"
                prune_last_layer: true
                props: tensor
                target_method: direct
                target_tensor_irreps:
                  +nmr_helpers.extract_ms_isotropy.ScalarTarget: {}

data:
  train:
    path: data/nmr_iso/train.xyz
    property_map: {MS_Iso_QM: tensor}
    shuffle: true
  valid:
    path: data/nmr_iso/valid.xyz
    property_map: {MS_Iso_QM: tensor}
  test: null

loss:
  isotropy:
    +nmr_helpers.shared_head_training.ElementBalancedMSE:
      # Identical objective to 13B: 1000 * mean of Si/O standardized MSEs.
      # Both elements occur in every structure in this fixed-composition dataset.
      si_std: 8.789599019755547
      o_std: 19.197689920683118
      weight: 1000.0

fitting:
  # Use the complete training split for initial elemental offsets.
  pre_fit_model: true
  max_n_pre_fit: null
  callbacks:
    - +nmr_helpers.shared_head_training.ElementRMSELogger: {}
  trainer_kwargs:
    accelerator: auto
    devices: 1
    precision: 32-true
    accumulate_grad_batches: 4
    # Ceiling, not a target duration. Validation early stopping is retained.
    max_epochs: 5000
    num_sanity_val_steps: 0
    log_every_n_steps: 10
  loader_kwargs:
    batch_size: 1
    num_workers: 0
    persistent_workers: false
    pin_memory: false
  optimizer:
    name: AdamW
    lr: 0.003
    # Explicitly disable AdamW's default 0.01 decay. Fit the unregularized
    # affine-head objective used by our earlier separate-linear-head probes.
    weight_decay: 0.0
  scheduler:
    name: ReduceLROnPlateau
    patience: 25
    factor: 0.8
  early_stopping:
    patience: 300
  keep: best

wandb:
  entity: trin4011-university-of-oxford
  project: transfer-learning
  name: 14-TensorNequIP-NMR-SeparateHeads
  log_model: false

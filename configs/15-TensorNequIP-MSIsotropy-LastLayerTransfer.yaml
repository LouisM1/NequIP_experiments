# Experiment 15: shared scalar readout plus final interaction-layer fine-tuning.
# Initialise embeddings and all four interaction layers from the original E/F
# checkpoint; keep embeddings and layers 0, 1 and 2 frozen. Train layer 3.
# Fresh shared NMR readout: 128 weights, plus the existing 2 elemental scales
# and 2 offsets. No NMR-trained weights or optimizer/scheduler state transferred.
# The outer freeze_all_except sets the final mask after E/F transfer.
# Scales/offsets are pre-fitted on training labels only and remain trainable.
# Relative loss weighting, splits, batching, scheduler and stopping match 14.
# Initial learning rate also matches 14. Head arrangement and trainable layers
# still differ; run long enough (or resume) to assess convergence.
# Existing helpers and train.sbatch suffice; no new Python module is needed.
# Suggested RUN_NAME for train.sbatch: 15-TensorNequIP-NMR-LastLayer

general:
  seed: 42
  progress: logged

model:
  +freeze_all_except:
    # Regexes match parameter names; layers.3 is the FOURTH interaction layer.
    pattern:
      - '^models\.nequip\.layers\.3\.'
      - '^models\.nequip\.tensor_readout\.'
      - '^models\.nequip\.scaler\.per_element_scaling$'
      - '^models\.offset\._offsets$'
    model:
      +nmr_helpers.shielding_transfer.from_energy_force_model:
        checkpoint: graph-pes-results/Kavanagh-Med-9059603/model.pt
        freeze_backbone: true
        model:
          +nmr_helpers.extract_ms_isotropy.ScalarTensorAdditionModel:
            offset:
              +LearnableTensorOffset:
                length: 1
            nequip:
              +TensorNequIP:
                elements: ["Si", "O"]
                cutoff: 6.0
                layers: 4
                radial_features: 64
                features:
                  node_irreps: "128x0e + 64x1o + 32x2e"
                  edge_irreps: "1x0e + 1x1o + 1x2e"
                prune_last_layer: true
                props: tensor
                target_method: direct
                target_tensor_irreps:
                  +nmr_helpers.extract_ms_isotropy.ScalarTarget: {}

data:
  train:
    path: data/nmr_iso/train.xyz
    property_map: {MS_Iso_QM: tensor}
    shuffle: true
  valid:
    path: data/nmr_iso/valid.xyz
    property_map: {MS_Iso_QM: tensor}
  test: null

loss:
  isotropy:
    +nmr_helpers.shared_head_training.ElementBalancedMSE:
      # Same relative elemental weighting as 13B; remove its x1000 multiplier.
      # Both elements occur in every structure in this fixed-composition dataset.
      si_std: 8.789599019755547
      o_std: 19.197689920683118
      weight: 1.0

fitting:
  # Use the complete training split for initial elemental offsets and scales.
  pre_fit_model: true
  max_n_pre_fit: null
  callbacks:
    - +nmr_helpers.shared_head_training.ElementRMSELogger: {}
  trainer_kwargs:
    accelerator: auto
    devices: 1
    precision: 32-true
    accumulate_grad_batches: 4
    # Ceiling, not a target duration. Validation early stopping is retained.
    max_epochs: 5000
    num_sanity_val_steps: 0
    log_every_n_steps: 10
  loader_kwargs:
    batch_size: 1
    num_workers: 0
    persistent_workers: false
    pin_memory: false
  optimizer:
    name: AdamW
    # Match 12/13/14; assess stability now that the final layer also trains.
    # One learning rate; retain the existing decay / no-decay groups.
    lr: 0.003
    # Same 0.01 decay as experiments 12/13 (previously AdamW's implicit default).
    # graph-pes excludes elemental scales and offsets from weight decay.
    weight_decay: 0.01
  scheduler:
    name: ReduceLROnPlateau
    patience: 25
    factor: 0.8
  early_stopping:
    patience: 300
  keep: best

wandb:
  entity: trin4011-university-of-oxford
  project: transfer-learning
  name: 15-TensorNequIP-NMR-LastLayer
  log_model: false
